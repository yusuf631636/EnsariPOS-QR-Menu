<title>Restoran Bilgileri - Öz Urfa Yusuf Usta</title>
<style>
  :root{
    --brand:#3498db; --bg:#faf6ee; --text:#2a1c14; --card:#fff; --muted:#8a7a68; --gold:#c9a227;
    --shadow:0 6px 18px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);max-width:520px;margin-left:auto;margin-right:auto;padding-bottom:30px}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb, var(--brand) 60%, #000));color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  header a{color:#fff;text-decoration:none;font-size:20px;line-height:1}
  header h1{margin:0;font-size:17px;font-weight:800}
  .hero-card{margin:16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:26px 20px;text-align:center;border:1px solid rgba(128,128,128,.1)}
  .hero-card img{width:auto;max-width:200px;height:64px;border-radius:14px;object-fit:contain;background:#fff;padding:4px 8px;margin-bottom:10px}
  .hero-card h2{margin:0;font-size:20px;font-weight:800}
  .hero-card p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .info-card{margin:0 16px 16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid rgba(128,128,128,.1);overflow:hidden}
  .info-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(128,128,128,.1)}
  .info-row:last-child{border-bottom:none}
  .info-row .ic{font-size:19px;flex:none;width:26px;text-align:center}
  .info-row .label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .info-row .value{font-size:14.5px;font-weight:700;color:var(--text)}
  .info-row a.value{color:var(--text);text-decoration:none}
  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;margin-top:2px}
  .status-pill .dot{width:7px;height:7px;border-radius:50%}
  .status-pill.open{color:#1e8e3e}
  .status-pill.open .dot{background:#2ecc71;box-shadow:0 0 6px #2ecc71}
  .status-pill.closed{color:#c0392b}
  .status-pill.closed .dot{background:#e74c3c;box-shadow:0 0 6px #e74c3c}
  .directions-btn{display:block;margin:0 16px 16px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb, var(--brand) 70%, #000));color:#fff;text-align:center;text-decoration:none;font-weight:800;font-size:14.5px;padding:14px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .maps-wrap{margin:0 16px 16px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .social-row{display:flex;justify-content:center;gap:12px;margin:0 16px 20px}
  .social-row a{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
</style>
</head>

<script>
(async function(){
  try{
    const data = await fetch('/api/delivery-zones').then(r=>r.json());
    const hours = String(data.workingHours || '').trim();
    if (!hours) return;
    document.getElementById('hoursValue').textContent = hours;
    const m = hours.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if (!m) return;
    const now = new Date();
    const mins = now.getHours()*60 + now.getMinutes();
    const start = (+m[1])*60 + (+m[2]);
    const end = (+m[3])*60 + (+m[4]);
    const isOpen = end > start ? (mins>=start && mins<end) : (mins>=start || mins<end);
    document.getElementById('statusPill').innerHTML = `<span class="status-pill ${isOpen?'open':'closed'}"><span class="dot"></span>${isOpen?'Şu anda açık':'Şu anda kapalı'}</span>`;
  }catch{}
})();
</script>
