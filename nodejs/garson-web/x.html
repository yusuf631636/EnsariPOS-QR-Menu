    var ttl;
    //ttl değeri cihazın offline olarak kaç gün geçirdiğini sayar.
    function hesapla() {
        var lastdate = storage.getItem("lastControl");
        ttl = storage.getItem("TTL");
        var dateksi = new Date(lastdate);
        var dateyeni = new Date(newdate);
        var timediff = Math.abs(dateyeni.getTime() - dateksi.getTime());
        var diffDays = Math.ceil(timediff / (1000 * 3600 * 24));
        ttl = dateksi > dateyeni ? 0 : ttl - diffDays;
    }

            licenceControl(deviceid, email, latitude, longitude, licenseid, function (result) {
                storage.setItem("TTL", 18);
                storage.setItem("lastControl", newdate);
                var success = result;
                if (success != true) {
                    navigator.notification.alert(storage.getItem("licence_not_found"),
                        function () {
                            storage.removeItem("licence");
                            window.location = 'Config.html';
                        },

                } else {
                    girismain();
                }
            });
        } else {

            storage.setItem("TTL", ttl);
            girismain();
