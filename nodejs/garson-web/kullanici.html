<!DOCTYPE html>
<html>
<head>
    
 
  <meta name="viewport" content="width=device-width, initial-scale=1,user-scalable=no">
    <script src="scripts/Jquery.min.js"></script>
    <link href="css/bootstrap.min.css" rel="stylesheet"/>
    <script src="scripts/bootstrap.min.js"></script>
    <script src="scripts/Queries.js"></script>
    <title></title>
    <script>
        function onDeviceReady() {
            document.addEventListener("backbutton", yourCallbackFunction, false);
        }

        function yourCallbackFunction() {

        }

        $(function () {
            document.addEventListener("deviceready", onDeviceReady, false);
            $("#user").val(storage.getItem("username"));
            var lastusername = storage.getItem("username");
            var lastterminal = storage.getItem("terminal");
            var lastdepartment = storage.getItem("department");
            var lasttickettype = storage.getItem("ticketType");
            $(".kaydet")
                .click(function() {
                    var username = $("#user").val();
                    storage.setItem("username", username);
                    if (username != lastusername && storage.getItem("terminalId")) {
                        unregisterTerminal(storage.getItem("terminalId"));
                    }
                    window.location = 'x.html';
                })
            $("#geridon")
                .click(function() {
                    window.location = "x.html";
                })
        })
    </script>
</head>
<body>
    <div style="text-align:center;margin-top:30%;">
        <div class="form-group" style="width:60%;text-align:center;margin-left:20%">
            <label class="control-label col-sm-2">User:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="user" placeholder="Username">
            </div>
        </div>
        <div style="text-align:center" class="form-group">
            <div class="col-sm-offset-4 col-sm-10">
                <input type="button" id="geridon" class="btn btn-warning" value="Back" />
                <button type="button" class="btn btn-success kaydet">Save</button>
            </div>
        </div>
    </div>

</body>
</html>
