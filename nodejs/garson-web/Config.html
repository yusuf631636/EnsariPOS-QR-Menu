        /* Elle yazmak yerine SambaPOS'tan GERCEK Terminal/Departman/Adisyon Tipi/
           Menu/Masa Ekrani listesini otomatik cek (kullanici istegi, 26.09.2026:
           "degerleri otomatik cekmez mi") - server.js'teki /api/admin/terminal-config-options

           hem tunelden slug/qrmenu onekiyle acilabildigi icin API_BASE ayni desenle
           hesaplanir (bkz. garson.html). */
        function apiBaseForConfig() { return location.pathname.replace(/\/garson-web(\/.*)?$/, '').replace(/\/+$/, ''); }
        /* 26.09.2026 GERI ALINDI: "birden çok seçenek seçilebilsin" istegi
           uygulanmisti ama kullanici canli testte kirdi - Queries.js bu
           degerlerin HEPSINI (terminal/departman/adisyon tipi/menu/varlik
           ekrani) TEK, TAM ESLESEN bir isim olarak GraphQL sorgularina
           (registerTerminal, getMenu, getEntityScreenItems...) gonderiyor.
           Virgulle birlestirilmis "A,B" gibi bir deger HICBIR SambaPOS
           kaydiyla eslesmiyor - kullanici bulgusu: "birden fazla secince
           ekran bos geldi". Bu yuzden TEK secim'e donuldu, [multiple]
           HTML'den de kaldirildi (asagida). */
        function fillConfigSelect(id, values, savedValue, fallbackRegex) {
            var $sel = $('#' + id);
            $sel.empty();
            (values || []).forEach(function (v) { $sel.append($('<option></option>').val(v).text(v)); });
            var chosen = (savedValue && values.indexOf(savedValue) !== -1) ? savedValue : null;
            if (!chosen && fallbackRegex) { var m = values.find(function (v) { return fallbackRegex.test(v); }); if (m) chosen = m; }
            if (!chosen && values.length === 1) chosen = values[0];
            if (chosen) $sel.val(chosen);
        }
        function revertToManualInput(id, savedValue) {
            $('<input type="text" class="form-control">').attr('id', id).val(savedValue || '').each(function () {
                $('#' + id).replaceWith(this);
            });
        }
        function loadConfigOptions() {
            $('#entity').off('change').on('change', function () {
                $('#entityType').val($(this).find(':selected').attr('data-type') || '');
            });
            $.getJSON(apiBaseForConfig() + '/api/admin/terminal-config-options').done(function (data) {
                fillConfigSelect('terminal', data.terminals || [], storage.getItem('terminal'));
                fillConfigSelect('department', data.departments || [], storage.getItem('department'), /restoran/i);
                fillConfigSelect('ticket', data.ticketTypes || [], storage.getItem('ticketType'), /adisyon/i);
                fillConfigSelect('menu', data.menus || [], storage.getItem('menu'));
                fillConfigSelect('automation', data.automationCommands || [], storage.getItem('automation'), /^hesap yaz$/i);
                var screens = data.entityScreens || [];
                var $entity = $('#entity');
                $entity.empty();
                screens.forEach(function (s) {
                    $entity.append($('<option></option>').val(s.name).attr('data-type', s.entityType || '').text(s.name + (s.entityType ? ' (' + s.entityType + ')' : '')));
                });
                var savedEntity = storage.getItem('entityScreen');
                var names = screens.map(function (s) { return s.name; });
                var chosenEntity = (savedEntity && names.indexOf(savedEntity) !== -1) ? savedEntity : null;
                if (!chosenEntity) { var m = screens.find(function (s) { return /masa/i.test(s.name) || /masa/i.test(s.entityType || ''); }); if (m) chosenEntity = m.name; }
                if (chosenEntity) $entity.val(chosenEntity);
                $entity.trigger('change');
            }).fail(function () {
                /* SambaPOS'a baglanilamadiysa (oturum suresi dolmus/SQL erisim
                   sorunu) dropdown'lar KULLANILAMAZ hale kalirdi - kullanici
                   bulgusu (26.09.2026): "elle giriş izni yok". Gercek elle
                   yazilabilir kutucuklara donulur, onceki kayitli deger korunur. */
                revertToManualInput('terminal', storage.getItem('terminal'));
                revertToManualInput('department', storage.getItem('department'));
                revertToManualInput('ticket', storage.getItem('ticketType'));
                revertToManualInput('menu', storage.getItem('menu'));
                revertToManualInput('automation', storage.getItem('automation'));
                revertToManualInput('entity', storage.getItem('entityScreen'));
                $('#entityType').removeAttr('readonly');
            });
        }

                storage.setItem("ticketType", ticketType);

                storage.setItem("automation", automation);
                storage.setItem("ip", ip);
               
                /* 20.09.2026 kullanıcı isteği: "lisans sorgulaması yok" -
                   SambaPOS'un kendi bulut lisans sunucularına (cpapi.sambapos.com)
                   giden bu kontrol, bu kurulumda geçerli bir lisansa bağlı

                storage.setItem("licence", "true");
                storage.setItem("TTL", 18);
                storage.setItem("lastControl", newdate);
                window.location = 'x.html';
            });
            $("#geridon").click(function () {
                window.location = "x.html";
            });
        });
        var myVar;
        function start(callback) {
            myVar = setTimeout(function () { callback() },

        }

        function stop() {
            clearTimeout(myVar);
        }
    </script>
